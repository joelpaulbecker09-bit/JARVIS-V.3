name: JARVIS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JARVIS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: JARVIS/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src config tests

      - name: Import UI server
        run: python -c "from src.ui.server import app; print('UI import OK')"

      - name: Check browser JavaScript syntax
        run: node --check src/ui/static/script.js

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
